services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragtool-backend
    command: ["/app/docker/backend-entrypoint.sh"]
    environment:
      DJANGO_PORT: "8001"
      DJANGO_RUN_ADDR: "0.0.0.0:8001"
      DJANGO_DEBUG: "False"
      SECURE_SSL_REDIRECT: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DATABASE_SSL_REQUIRE: ${DATABASE_SSL_REQUIRE}
      CHAINLIT_INTERNAL_API_TOKEN: ${CHAINLIT_INTERNAL_API_TOKEN}
      SURVEY_API_URL: ${SURVEY_API_URL}
      SURVEY_TOKEN_URL: ${SURVEY_TOKEN_URL}
      SURVEY_CLIENT_ID: ${SURVEY_CLIENT_ID}
      SURVEY_CLIENT_SECRET: ${SURVEY_CLIENT_SECRET}
      SURVEY_SCOPE: ${SURVEY_SCOPE}
      SURVEY_URL: ${SURVEY_URL}
      SURVEY_API_KEY: ${SURVEY_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8001), 3); s.close(); print('ok')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragtool-mcp
    command: ["/app/docker/mcp-entrypoint.sh"]
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8765"
      DJANGO_RUN_ADDR: "backend:8001"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      ROUTER_MODEL: ${ROUTER_MODEL}
      MCP_PLANNER_MODEL: ${MCP_PLANNER_MODEL}
      OPENWEBUI_URL: ${OPENWEBUI_URL}
      OPENWEBUI_API_TOKEN: ${OPENWEBUI_API_TOKEN}
      OPENWEBUI_BESTPRACTICES_MODEL: ${OPENWEBUI_BESTPRACTICES_MODEL}
      OPENWEBUI_TIMEOUT_SECONDS: ${OPENWEBUI_TIMEOUT_SECONDS}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8765), 3); s.close(); print('ok')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  chainlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragtool-chainlit
    command: ["/app/docker/chainlit-entrypoint.sh"]
    environment:
      CHAINLIT_PORT: "8000"
      DJANGO_RUN_ADDR: "backend:8001"
      MCP_SERVER_URL: "http://mcp:8765/mcp"
      CHAINLIT_DATABASE_URL: ${CHAINLIT_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      CHAINLIT_INTERNAL_API_TOKEN: ${CHAINLIT_INTERNAL_API_TOKEN}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL}
      AZURE_OPENAI_MODELS: ${AZURE_OPENAI_MODELS}
      LLM_MODEL: ${LLM_MODEL}
      ROUTER_MODEL: ${ROUTER_MODEL}
      MCP_PLANNER_MODEL: ${MCP_PLANNER_MODEL}
      MCP_CLIENT_TIMEOUT_SECONDS: ${MCP_CLIENT_TIMEOUT_SECONDS}
      CHAINLIT_AGENT_HISTORY_WINDOW: ${CHAINLIT_AGENT_HISTORY_WINDOW}
      DJANGO_AUTH_VALIDATE_URL: ${DJANGO_AUTH_VALIDATE_URL}
      DJANGO_AUTH_LOGIN_URL: ${DJANGO_AUTH_LOGIN_URL}
      DJANGO_FAVORITES_URL: ${DJANGO_FAVORITES_URL}
      CHAINLIT_ENABLE_HEADER_AUTH: ${CHAINLIT_ENABLE_HEADER_AUTH}
      DJANGO_AUTOSTART_LOG_TO_FILE: ${DJANGO_AUTOSTART_LOG_TO_FILE}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS}
      RAG_TOP_K: ${RAG_TOP_K}
      RAG_RETRIEVE_FUNCTION: ${RAG_RETRIEVE_FUNCTION}
      RAG_INGEST_FUNCTION: ${RAG_INGEST_FUNCTION}
      RAG_ADMIN_MAX_FILE_SIZE_BYTES: ${RAG_ADMIN_MAX_FILE_SIZE_BYTES}
    ports:
      - "80:8000"
    depends_on:
      backend:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5); print('ok')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - chainlit_files:/app/.files
    restart: unless-stopped

volumes:
  chainlit_files:
